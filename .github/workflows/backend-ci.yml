name: Backend quality gates
on:
  push:
    paths: ['Backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['Backend/**', '.github/workflows/backend-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Backend
    services:
      postgres:
        image: postgres:18.6-alpine3.23@sha256:a0cbdbbcc57f7317ca183ac9d10eb3af72b5b05b2f25acad58e765bd2b139099
        env:
          POSTGRES_USER: ci_owner
          POSTGRES_PASSWORD: synthetic-ci-service-only
          POSTGRES_DB: beauty_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci_owner -d beauty_ci"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DJANGO_ENV: ci
      DJANGO_SETTINGS_MODULE: config.settings.ci
      DATABASE_URL: postgresql://ci_owner:synthetic-ci-service-only@127.0.0.1:5432/beauty_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.10'
      - name: Independent ephemeral CI secret
        run: python -c "import secrets,os; open(os.environ['GITHUB_ENV'],'a').write('SECRET_KEY='+secrets.token_urlsafe(64)+'\n')"
      - run: python -m pip install -r requirements-tools.txt
      - run: python -m pip check
      - run: python manage.py check
      - run: python scripts/scan_source_secrets.py
      - run: python -m ruff check . --select E9,F63,F7,F82
      - run: python -m mypy --strict apps/operaciones/domain/alerts.py apps/operaciones/infrastructure/backup_crypto.py
      - run: python -m bandit -c deployment/bandit.yaml -r apps config negocio -ll
      - run: mkdir -p backups && python -m pip_audit -r requirements.txt -f json -o backups/ci-dependencies.json
      - run: python -m pip_audit -r requirements-backup.txt -f json -o backups/ci-backup-dependencies.json
      - run: python manage.py test --noinput
      - name: Build immutable source image
        run: docker build -f deployment/Dockerfile -t beauty-manager:ci .
      - name: Build backup job image
        run: docker build -f deployment/Dockerfile.backup -t beauty-manager-backup:ci .
      - name: Container vulnerability gate
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL beauty-manager:ci
      - name: Backup container vulnerability gate
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL beauty-manager-backup:ci
      - name: HTTPS proxy vulnerability gate
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL
          nginx:1.30.6-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sanitized-security-results
          path: Backend/backups/ci-*-dependencies.json
          retention-days: 14
  # No deployment job: Railway/GitHub environments and approval owners do not exist yet.
