pid /tmp/nginx.pid;
error_log stderr crit;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 64k;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    server {
        listen 8000;
        server_name localhost 127.0.0.1;
        return 308 https://localhost:8443$request_uri;
    }
    server {
        listen 8443 ssl;
        server_name localhost;
        ssl_certificate /tls/server.crt;
        ssl_certificate_key /tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location = /privacy/ {
            default_type text/plain;
            return 200 "Entorno local de pruebas de Lasheo. Usar datos ficticios; aviso comercial pendiente.";
        }
        error_page 413 = @large;
        location @large {
            default_type application/json;
            return 413 '{"code":"request_too_large","detail":"Solicitud demasiado grande."}';
        }
        location / {
            proxy_pass http://beauty-local-web:8000;
            proxy_set_header Host localhost;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 50s;
            proxy_http_version 1.1;
        }
    }
}
